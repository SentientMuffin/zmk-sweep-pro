# MIPI DBI
CONFIG_MIPI_DBI=y
CONFIG_MIPI_DBI_SPI=y

# display
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_PRIORITY=5

# sd16XX
CONFIG_SSD16XX=y

# lvgl
CONFIG_LVGL=y
CONFIG_LV_DPI_DEF=130
CONFIG_LV_COLOR_DEPTH_1=y
CONFIG_LV_Z_BITS_PER_PIXEL=1

# zephyr-lvgl
# Larger VDB so LVGL flushes a bigger dirty region in one display_write instead
# of splitting it into many partial-refresh frames (reduces "flashing in quick
# succession" during rapid layer changes).
# NOTE: 100 caused full-frame blocking SPI flushes that stalled the split
# transport on the mouse layer (trackpad stream + BLE + display) -> hard hang
# requiring power cycle. 30 batches far better than 10 without the worst-case
# full-frame flush; raise cautiously and watch for the hang.
CONFIG_LV_Z_VDB_SIZE=30
CONFIG_LV_Z_DOUBLE_VDB=y
CONFIG_LV_Z_FULL_REFRESH=n
CONFIG_LV_Z_MEM_POOL_SIZE=49152

# lvgl widget
CONFIG_LV_FONT_MONTSERRAT_12=y
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_MONTSERRAT_16=y

CONFIG_LV_USE_IMAGE=y
CONFIG_LV_USE_FLEX=y

# hid-indicators CAPS (disabled: widget removed from status screen)
# CONFIG_ZMK_HID_INDICATORS=y
CONFIG_CUSTOM_WIDGET_INDICATORS_STATUS=n

# layer status (disabled: stops the layer widget redrawing/flashing on every
# layer change; screen layout auto-shifts to fill the gap)
CONFIG_CUSTOM_WIDGET_LAYER_STATUS=n

# trackpad status
CONFIG_CUSTOM_WIDGET_TRACKPAD_STATUS=y
